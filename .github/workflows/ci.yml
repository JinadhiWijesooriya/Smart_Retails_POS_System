name: Smart Retail POS - CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: smart_retail_pos_test
          POSTGRES_USER: pos_test_user
          POSTGRES_PASSWORD: pos_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos_test_user -d smart_retail_pos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Django System Check
        env:
          SECRET_KEY: ci-test-secret-key-django-smartpos-12345
          DEBUG: "True"
        run: |
          cd backend
          python manage.py check

      - name: Run Django Migrations
        env:
          SECRET_KEY: ci-test-secret-key-django-smartpos-12345
          DEBUG: "True"
          DB_ENGINE: django.db.backends.postgresql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: smart_retail_pos_test
          DB_USER: pos_test_user
          DB_PASSWORD: pos_test_password
          POSTGRES_DB: smart_retail_pos_test
          POSTGRES_USER: pos_test_user
          POSTGRES_PASSWORD: pos_test_password
        run: |
          cd backend
          python manage.py migrate

      - name: Run Django Test Suite
        env:
          SECRET_KEY: ci-test-secret-key-django-smartpos-12345
          DEBUG: "True"
          DB_ENGINE: django.db.backends.postgresql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: smart_retail_pos_test
          DB_USER: pos_test_user
          DB_PASSWORD: pos_test_password
          POSTGRES_DB: smart_retail_pos_test
          POSTGRES_USER: pos_test_user
          POSTGRES_PASSWORD: pos_test_password
        run: |
          cd backend
          python manage.py test apps.sales

  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Linter
        run: |
          cd frontend
          npm run lint

      - name: Build React Application (Typecheck & Vite)
        run: |
          cd frontend
          npm run build

  docker-ci:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Compose Build
        run: |
          docker compose build
